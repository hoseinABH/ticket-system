services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER=root
      POSTGRES_PASSWORD=secret
      POSTGRES_DB=ticket-system
    ports: ["5432:5432"]
  
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["5672:5672", "15672:15672"]
volumes:
  pgdata: